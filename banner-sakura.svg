<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1220"/>
      <stop offset="55%" stop-color="#6b2338"/>
      <stop offset="100%" stop-color="#c9738f"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9e3"/>
      <stop offset="100%" stop-color="#ff9ab3"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- sakura flower def -->
  <g id="sakuraFlower">
    <g fill="url(#petal)" opacity="0.9">
      <ellipse cx="0" cy="-11" rx="7" ry="11"/>
      <ellipse cx="10" cy="-4" rx="7" ry="11" transform="rotate(72 10 -4)"/>
      <ellipse cx="7" cy="9" rx="7" ry="11" transform="rotate(144 7 9)"/>
      <ellipse cx="-7" cy="9" rx="7" ry="11" transform="rotate(216 -7 9)"/>
      <ellipse cx="-10" cy="-4" rx="7" ry="11" transform="rotate(288 -10 -4)"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#ffe3ea"/>
  </g>

  <!-- scattered sakura flowers -->
  <use href="#sakuraFlower" x="1080" y="55" transform="scale(1.6)" transform-origin="1080 55" opacity="0.85"/>
  <use href="#sakuraFlower" x="1140" y="120" transform="scale(1.1)" transform-origin="1140 120" opacity="0.6"/>
  <use href="#sakuraFlower" x="1000" y="150" transform="scale(0.9)" transform-origin="1000 150" opacity="0.5"/>
  <use href="#sakuraFlower" x="60" y="250" transform="scale(1.3)" transform-origin="60 250" opacity="0.5"/>
  <use href="#sakuraFlower" x="1120" y="230" transform="scale(1.2)" transform-origin="1120 230" opacity="0.7"/>
  <use href="#sakuraFlower" x="150" y="40" transform="scale(0.8)" transform-origin="150 40" opacity="0.4"/>

  <!-- falling petals -->
  <ellipse cx="900" cy="80" rx="5" ry="8" fill="#ffd9e3" opacity="0.5" transform="rotate(30 900 80)"/>
  <ellipse cx="950" cy="200" rx="4" ry="7" fill="#ffd9e3" opacity="0.4" transform="rotate(-20 950 200)"/>
  <ellipse cx="300" cy="260" rx="4" ry="7" fill="#ffd9e3" opacity="0.4" transform="rotate(60 300 260)"/>

  <text x="110" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    🌸 Mailén Castellanos
  </text>
  <text x="110" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#ffdce6">
    Data Engineer en transición a Data Science
  </text>
  <text x="110" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffc2d1">
    Microsoft Fabric · Python · Spark · Azure · Power BI
  </text>
</svg>
